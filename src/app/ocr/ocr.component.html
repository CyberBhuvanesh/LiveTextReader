<div class="ocr-container">
    <span>📷 OCR Scanner 📷</span>

    <div class="video-wrapper" style="position: relative;">
        <video #video autoplay muted playsinline *ngIf="!photoCaptured"></video>
    
        <canvas #processingCanvas [hidden]="!photoCaptured"></canvas>
    
        <canvas #overlayCanvas class="overlay-canvas" (click)="onOverlayClick($event)"
            [hidden]="!photoCaptured"></canvas>
        <div *ngIf="selectedWord" class="popup-widget"
            [ngStyle]="{ left: popupPosition.x + 'px', top: popupPosition.y + 'px' }">
            {{ selectedWord.text }}
        </div>
    
        <div *ngIf="isLoading" class="loading-overlay">
            <mat-progress-spinner mode="indeterminate" [diameter]="50" color="accent"></mat-progress-spinner>
            <p>Scanning image...</p>
        </div>
    </div>
    

    <div class="controls">
        <button mat-raised-button color="accent" (click)="capturePhoto()" *ngIf="!photoCaptured">📸 Capture</button>
        <button mat-raised-button color="primary" (click)="retakePhoto()" *ngIf="photoCaptured">🔄 Retake</button>

        <mat-progress-spinner *ngIf="isLoading" mode="indeterminate" [diameter]="40"
            color="warn"></mat-progress-spinner>
    </div>

    <p *ngIf="extractedText">Extracted Text:</p>
    <pre>{{ extractedText }}</pre>
</div>
